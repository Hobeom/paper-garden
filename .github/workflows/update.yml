name: Update papers

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [daily, weekly-links, hf-prefetch]
        default: daily
  schedule:
    # off the top of the hour, when many scheduled jobs hit arXiv at once
    - cron: "41 1,13 * * *"  # daily: fetch, enrich, build explorer
    - cron: "0 8 * * 1"      # weekly-links: refresh code links
    - cron: "0 9 * * 1-5"    # hf-prefetch: Hugging Face daily papers cache

permissions:
  contents: write

# every task commits to main; run them one at a time
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TASK: >-
        ${{ inputs.task
          || (github.event.schedule == '0 8 * * 1' && 'weekly-links')
          || (github.event.schedule == '0 9 * * 1-5' && 'hf-prefetch')
          || 'daily' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: env.TASK != 'hf-prefetch'
        run: pip install -r requirements.txt

      - name: Install dependencies (requests only)
        if: env.TASK == 'hf-prefetch'
        run: pip install "$(grep -i '^requests==' requirements.txt)"

      - name: Fetch arXiv papers
        if: env.TASK == 'daily'
        run: python daily_arxiv.py

      - name: Enrich papers and grow related-paper graph
        if: env.TASK == 'daily'
        continue-on-error: true  # never block committing the fetched papers
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python enrich.py

      - name: Refresh code links
        if: env.TASK == 'weekly-links'
        run: python daily_arxiv.py --update_paper_links

      - name: Build explorer data
        if: env.TASK == 'daily' || env.TASK == 'weekly-links'
        continue-on-error: true  # never block committing the fetched papers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$TASK" = weekly-links ]; then
            python build_explorer.py --summaries 0
          else
            python build_explorer.py
          fi

      - name: Pre-fetch Hugging Face daily papers
        if: env.TASK == 'hf-prefetch'
        run: python prefetch_hf_papers.py

      - name: Commit and push data
        run: |
          git config user.name "HoBeom"
          git config user.email "jhb1365@gmail.com"
          git add -A arxiv docs hf_cache
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: ${TASK} update"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
